<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification Exam Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a test-centre terminal. Home is a calm operator console; the exam itself is a flat, distraction-free test driver. */
:root{
  --paper:#f3f5f7; --panel:#ffffff; --ink:#17212b; --muted:#566473; --line:#d6dde4;
  --accent:#0a5a8f; --accent-ink:#ffffff; --accent-soft:#e2eff7;
  --bar:#13293d; --bar-ink:#eef3f7; --bar-muted:#a9bccb;
  --flag:#a85f00; --flag-soft:#fdf0db; --good:#17693f; --good-soft:#e0f2e8; --bad:#ab2a2a; --bad-soft:#fae6e4;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --qsize:17px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#0f171f; --panel:#17222d; --ink:#e7edf2; --muted:#9dadbb; --line:#2c3a48;
  --accent:#5db1e6; --accent-ink:#06202f; --accent-soft:#17364b;
  --bar:#0a1219; --bar-ink:#e7edf2; --bar-muted:#8fa3b3;
  --flag:#f2b45a; --flag-soft:#3a2c13; --good:#6fd3a0; --good-soft:#143226; --bad:#f39a92; --bad-soft:#3c1d1c;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0f171f; --panel:#17222d; --ink:#e7edf2; --muted:#9dadbb; --line:#2c3a48;
  --accent:#5db1e6; --accent-ink:#06202f; --accent-soft:#17364b;
  --bar:#0a1219; --bar-ink:#e7edf2; --bar-muted:#8fa3b3;
  --flag:#f2b45a; --flag-soft:#3a2c13; --good:#6fd3a0; --good-soft:#143226; --bad:#f39a92; --bad-soft:#3c1d1c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:24px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);padding:1px 4px;border-radius:3px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:20px}
.top{background:var(--bar);color:var(--bar-ink);padding:12px 16px}
.top-in{max-width:1008px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top strong{font-size:16px;font-weight:600}
.top .sync{margin-left:auto;font-size:12px;color:var(--bar-muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{font:500 14px/1.2 var(--sans);padding:9px 14px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);padding:4px;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.flag{background:var(--flag-soft);color:var(--flag)}
label.field{display:grid;gap:4px;font-size:13px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{font:400 14px/1.4 var(--sans);padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.exam-card{display:grid;gap:12px;border-top:4px solid var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font:600 22px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bankrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.bankrow .nm{min-width:0;overflow-wrap:anywhere}
.drop{border:2px dashed var(--line);border-radius:6px;padding:20px;display:grid;gap:8px;justify-items:start;background:var(--panel)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.banner{padding:10px 12px;border-radius:4px;background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.banner.warn{background:var(--flag-soft);border-left-color:var(--flag)}
.banner.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}

/* Exam driver */
.driver{display:grid;grid-template-rows:auto auto 1fr auto;height:100%;background:var(--panel)}
.dbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
.dbar .ttl{font-weight:600;min-width:0}
.dbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums;padding:5px 8px;border-radius:3px}
.timer.low{background:var(--bad);color:#fff}
.dbtn{background:transparent;color:var(--bar-ink);border:1px solid var(--bar-muted);border-radius:3px;font:500 13px var(--sans);padding:5px 9px;cursor:pointer}
.qmeter{height:4px;background:var(--line)}
.qmeter i{display:block;height:100%;background:var(--accent)}
.dbody{overflow:auto;min-height:0}
.split{display:grid;grid-template-columns:1fr;height:100%;min-height:0}
.split.has-ctx{grid-template-columns:minmax(0,42%) minmax(0,58%)}
.ctx{background:var(--paper);border-right:1px solid var(--line);padding:20px;overflow:auto;white-space:pre-wrap;font-size:15px}
.ctx h3{margin-bottom:8px;white-space:normal}
.qpane{padding:24px 28px;overflow:auto;font-size:var(--qsize)}
.qinner{max-width:800px;margin:0 auto;display:grid;gap:16px}
.qnum{font-size:13px;color:var(--muted);font-weight:600}
.stem{white-space:pre-wrap;overflow-wrap:anywhere}
.exhibit{max-width:100%;border:1px solid var(--line);border-radius:3px;background:#fff;display:block}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:4px;padding:10px 8px 10px 12px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.struck .otxt{text-decoration:line-through;color:var(--muted)}
.opt input{margin:5px 2px 0 0;accent-color:var(--accent);flex:none}
.opt .ol{font-weight:600;flex:none;min-width:1.2em}
.opt .otxt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.opt .x{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;text-decoration:underline}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dfoot{background:var(--paper);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 14px;align-items:center;flex-wrap:wrap}
.dfoot .sp{flex:1}
.flag-on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.explain{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 4px 4px 0;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tile{display:flex;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:3px;padding:8px;background:var(--panel);cursor:pointer;font:500 13px var(--sans);color:var(--ink);text-align:left}
.tile.un{border-color:var(--bad);color:var(--bad)}
.tile.fl{background:var(--flag-soft);border-color:var(--flag)}
.modal-bg{position:fixed;inset:0;background:rgba(6,16,24,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);color:var(--ink);border-radius:6px;padding:20px;max-width:560px;width:100%;max-height:90%;overflow:auto;display:grid;gap:12px;border:1px solid var(--line)}
.score{font:600 54px/1 var(--mono);font-variant-numeric:tabular-nums}
.scale{position:relative;height:10px;background:var(--line);border-radius:5px;margin:22px 0 6px}
.scale i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.scale.pass i{background:var(--good)}.scale.fail i{background:var(--bad)}
.scale b{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.scale span{position:absolute;top:-22px;font-size:11px;transform:translateX(-50%);color:var(--muted);white-space:nowrap}
.dom{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rq{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:10px 14px;border-radius:4px;z-index:30;max-width:90%}
@media (max-width:760px){
  .split.has-ctx{grid-template-columns:1fr;height:auto}
  .ctx{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
  .qpane{padding:16px}
  .dom{grid-template-columns:minmax(0,1fr) 70px 48px}
}
@media (prefers-reduced-motion:no-preference){ .progress i{transition:width .2s} }
</style>
</head>
<body>
<div id="app" style="height:100%"></div>
<div id="modal"></div>
<div id="toast"></div>
<input id="pdf-file" type="file" accept="application/pdf,.pdf" tabindex="-1" aria-label="Choose a PDF" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">
<noscript>This simulator needs JavaScript.</noscript>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clock=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const LETTERS='ABCDEFGHIJKLMNOP';
const dateStr=t=>new Date(t).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
function daysTo(d){if(!d)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+'T00:00:00');return Math.round((b-a)/864e5)}
const toast=m=>{const t=$('#toast');t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',3500)};

/* ---------- storage: this browser first, your Claude account when available ---------- */
const Local={
  db:null,mem:new Map(),
  open(){return new Promise(res=>{try{const r=indexedDB.open('exam-simulator',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{Local.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  async get(k){if(!this.db)return this.mem.get(k);return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  async set(k,v){this.mem.set(k,v);if(!this.db)return;return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})},
  async del(k){this.mem.delete(k);if(!this.db)return;return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})},
  async keys(p){if(!this.db)return[...this.mem.keys()].filter(k=>k.startsWith(p));return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result.filter(k=>String(k).startsWith(p)));q.onerror=()=>res([])}catch(e){res([])}})},
};
const stripData=v=>JSON.parse(JSON.stringify(v,(k,x)=>typeof x==='string'&&x.startsWith('data:image')?undefined:x));
const Cloud={
  col:null,
  async init(){try{if(!window.claude||!claude.use)return false;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);const id=user&&await user.id();if(!db||!id)return false;this.col=db.collection('data/users/'+id);return true}catch(e){return false}},
  async set(k,kind,v){if(!this.col)return;try{await this.col.doc(k).set({kind,t:Date.now(),v:stripData(v)});setSync('ok')}catch(e){setSync(e&&e.code==='quota_exceeded'?'full':'off')}},
  async get(k){if(!this.col)return null;try{const d=await this.col.doc(k).get();return d.exists?d.data():null}catch(e){return null}},
  async del(k){if(!this.col)return;try{await this.col.doc(k).delete()}catch(e){}},
  async list(kind){if(!this.col)return[];try{const q=await this.col.where('kind','==',kind).limit(1000).get();return q.docs.map(d=>d.data())}catch(e){return[]}},
};
function setSync(s){S.sync=s;const e=$('#sync');if(e)e.textContent=syncLabel()}
const syncLabel=()=>({ok:'Saved to your Claude account',local:'Saved in this browser only',off:'Could not reach your account, saved in this browser',full:'Account storage is full, saved in this browser',wait:'Connecting…'}[S.sync]||'');

/* ---------- default exams ---------- */
const DEFAULT_EXAMS=[
 {key:'cca-f',code:'CCA-F',name:'Claude Certified Architect – Foundations',qs:60,mins:120,pass:720,min:100,date:'2026-11-28',lock:false,note:'Scenario based. 60 questions in 120 minutes, 720 to pass.'},
 {key:'sc-300',code:'SC-300',name:'Microsoft Identity and Access Administrator',qs:50,mins:100,pass:700,min:1,date:'',lock:true,note:'Usually 40 to 60 questions in 100 minutes, 700 to pass. Case studies and Yes/No sets lock once you leave them.'},
];
const SAMPLE_NOTE='Sample questions written for this simulator so you can try it. They are not from any real exam.';
const SAMPLES=[
{id:'sample-cca',name:'Sample set',examKey:'cca-f',sample:true,questions:[
 {id:'c1',n:1,topic:'Agentic Architecture & Orchestration',context:'Scenario: Customer support agent\nYou are building a support agent on the Claude API. It uses tools to look up orders and issue refunds.',stem:'Your loop calls the Messages API, runs any tools Claude requests, and sends back the results. Which signal should decide when the loop ends?',options:[{k:'A',t:'A fixed limit of three iterations on every request'},{k:'B',t:'The response stop_reason no longer being tool_use'},{k:'C',t:'Finding the word "done" in the response text'},{k:'D',t:'A timer of 30 seconds per conversation'}],answer:['B'],explanation:'stop_reason tells you why Claude stopped. Keep looping while it is tool_use. An iteration cap is a reasonable safety net, but it should not be the main exit. Text matching is fragile.'},
 {id:'c2',n:2,topic:'Tool Design & MCP Integration',context:'Scenario: Customer support agent\nYou are building a support agent on the Claude API. It uses tools to look up orders and issue refunds.',stem:'Claude keeps calling get_customer when it should call get_order. Both tools have one-line descriptions. What is the most effective first step?',options:[{k:'A',t:'Rewrite both descriptions to state what each returns, when to use it and when not to'},{k:'B',t:'Add a routing model in front of Claude'},{k:'C',t:'Merge the two tools into one'},{k:'D',t:'Add few-shot examples to every user message'}],answer:['A'],explanation:'Tool descriptions are the main input Claude uses to choose a tool. Fix those before adding more moving parts.'},
 {id:'c3',n:3,topic:'Prompt Engineering & Structured Output',stem:'A pipeline must extract invoice fields into a fixed JSON shape every time. Which approach gives the most reliable structure?',options:[{k:'A',t:'Ask for JSON in the system prompt and parse the text'},{k:'B',t:'Define a tool with a JSON schema and force Claude to call it with tool_choice'},{k:'C',t:'Post-process free text with regular expressions'},{k:'D',t:'Raise the temperature so Claude tries more formats'}],answer:['B'],explanation:'A forced tool call with a JSON schema gives you structured arguments rather than free text you have to parse.'},
 {id:'c4',n:4,topic:'Claude Code Configuration & Workflows',stem:'Your team wants every developer to get the same Claude Code coding standards for a repository. Where should they go?',options:[{k:'A',t:'Each developer\'s ~/.claude/CLAUDE.md'},{k:'B',t:'A CLAUDE.md committed to the repository'},{k:'C',t:'A note in the README that people paste into each session'},{k:'D',t:'An environment variable on each laptop'}],answer:['B'],explanation:'A CLAUDE.md in the repository travels with the code and applies to the whole team. The file in your home folder is personal.'},
 {id:'c5',n:5,topic:'Context Management & Reliability',stem:'You need to classify 200,000 documents overnight and nobody is waiting on the results. Which option fits best?',options:[{k:'A',t:'The Message Batches API'},{k:'B',t:'Streaming each request'},{k:'C',t:'Parallel synchronous calls from one script at peak rate'},{k:'D',t:'One request containing all documents'}],answer:['A'],explanation:'Batches suit large, non-urgent work: requests run asynchronously at a lower price than standard calls.'},
]},
{id:'sample-sc300',name:'Sample set',examKey:'sc-300',sample:true,questions:[
 {id:'s1',n:1,topic:'Plan and automate identity governance',stem:'Admins should activate the Global Administrator role only when they need it, with an approval step. What should you configure?',options:[{k:'A',t:'Eligible assignments in Microsoft Entra Privileged Identity Management'},{k:'B',t:'A dynamic group with the role assigned'},{k:'C',t:'Security defaults'},{k:'D',t:'An app registration with Directory.ReadWrite.All'}],answer:['A'],explanation:'PIM eligible assignments give just-in-time activation, and role settings can require approval.'},
 {id:'s2',n:2,topic:'Implement authentication and access management',stem:'You want to see how a new Conditional Access policy would affect users before you enforce it. Which policy state should you use?',options:[{k:'A',t:'On'},{k:'B',t:'Off'},{k:'C',t:'Report-only'},{k:'D',t:'Audit'}],answer:['C'],explanation:'Report-only evaluates the policy at sign-in and logs the result without enforcing it.'},
 {id:'s3',n:3,topic:'Implement and manage user identities',stem:'Which TWO sign-in options let cloud users keep signing in when the on-premises AD DS environment is down, without extra on-premises agents being available? Choose two.',options:[{k:'A',t:'Password hash synchronisation'},{k:'B',t:'Cloud-only accounts'},{k:'C',t:'Pass-through authentication'},{k:'D',t:'Federation with AD FS on-premises'}],answer:['A','B'],explanation:'Both validate the credential in Microsoft Entra ID. Pass-through authentication and on-premises AD FS need on-premises components to be up.'},
 {id:'s4',n:4,topic:'Plan and implement workload identities',stem:'Note: This question is part of a series of questions that present the same goal. You need an Azure VM to read Key Vault secrets without storing credentials in code.\nSolution: You enable a system-assigned managed identity on the VM and grant it access to the vault.\nDoes this meet the goal?',options:[{k:'A',t:'Yes'},{k:'B',t:'No'}],answer:['A'],explanation:'Managed identities get tokens from the platform, so no credential is stored in code.',series:true},
 {id:'s5',n:5,topic:'Plan and implement workload identities',stem:'Note: This question is part of a series of questions that present the same goal. You need an Azure VM to read Key Vault secrets without storing credentials in code.\nSolution: You create an app registration and save its client secret in an app settings file on the VM.\nDoes this meet the goal?',options:[{k:'A',t:'Yes'},{k:'B',t:'No'}],answer:['B'],explanation:'The client secret is still a stored credential on the VM.',series:true},
]}];

/* ---------- PDF reading ---------- */
let pdfjs=null;
const timed=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('reader-load')),ms))]);
async function loadPdfLib(){
  if(pdfjs)return pdfjs;
  if(window.pdfjsLib)return pdfjs=window.pdfjsLib;
  const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/';
  try{
    const lib=await timed(import(base+'pdf.min.mjs'),25000);
    await timed(import(base+'pdf.worker.min.mjs'),25000); /* runs on this page, so no separate worker is needed */
    return pdfjs=lib;
  }catch(e){
    const old='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    for(const f of ['pdf.min.js','pdf.worker.min.js'])await timed(new Promise((ok,no)=>{const t=document.createElement('script');t.src=old+f;t.onload=ok;t.onerror=()=>no(new Error('reader-load'));document.head.append(t)}),25000);
    return pdfjs=window.pdfjsLib;
  }

  return dedupe(out);
}

/* ---------- app state ---------- */
const S={view:'home',settings:null,banks:[],attempts:[],session:null,qcache:new Map(),sync:'local',imp:null,sample:null,assets:null,fontScale:1};
const allBanks=()=>[...SAMPLES.filter(b=>!(S.settings.hideSamples||[]).includes(b.id)).map(b=>({id:b.id,name:b.name,examKey:b.examKey,count:b.questions.length,sample:true})),...S.banks];
const examOf=k=>S.settings.exams.find(e=>e.key===k)||S.settings.exams[0];
async function saveSettings(){S.settings.t=Date.now();await Local.set('settings',S.settings);Cloud.set('settings','settings',S.settings)}
async function getQuestions(id){
  if(S.qcache.has(id))return S.qcache.get(id);
  const sam=SAMPLES.find(b=>b.id===id);if(sam){const q=sam.questions.map(x=>({manual:false,pick:x.answer.length>1?x.answer.length:0,images:[],answerImages:[],series:false,context:'',...x,id:id+'-'+x.id,bankId:id}));S.qcache.set(id,q);return q}
  let qs=await Local.get('questions.'+id);
  if(!qs){
    const meta=S.banks.find(b=>b.id===id);qs=[];
    for(let i=0;i<(meta&&meta.chunks||0);i++){const d=await Cloud.get('chunk.'+id+'.'+i);if(d&&d.v)qs.push(...d.v.q)}
    qs.forEach(q=>{q.images=(q.images||[]).filter(Boolean);q.answerImages=(q.answerImages||[]).filter(Boolean)});
    if(qs.length)await Local.set('questions.'+id,qs);
  }
  qs=qs||[];qs.forEach(q=>q.bankId=id);S.qcache.set(id,qs);return qs;
}
async function pushBank(meta,qs){
  if(!Cloud.col)return;
  const chunks=[];let cur=[],size=0;
  for(const q of qs){const j=JSON.stringify(stripData(q)).length;if(size+j>180000&&cur.length){chunks.push(cur);cur=[];size=0}cur.push(q);size+=j}
  if(cur.length)chunks.push(cur);
  meta.chunks=chunks.length;
  for(let i=0;i<chunks.length;i++)await Cloud.set('chunk.'+meta.id+'.'+i,'chunk',{q:chunks[i]});
  await Cloud.set('bank.'+meta.id,'bank',meta);
}
async function storeImages(qs){
  if(!S.assets)return;
  const up=async d=>{try{const bytes=Uint8Array.from(atob(d.split(',')[1]),c=>c.charCodeAt(0));const a=await S.assets.upload(new Blob([bytes],{type:'image/jpeg'}));return a.url||('/_blob/'+a.id)}catch(e){return d}};
  for(const q of qs){q.images=await Promise.all(q.images.map(up));q.answerImages=await Promise.all(q.answerImages.map(up))}
}
async function saveBank(meta,qs){
  S.qcache.set(meta.id,qs);
  await Local.set('questions.'+meta.id,qs);
  await Local.set('bank.'+meta.id,meta);
  if(!S.banks.some(b=>b.id===meta.id))S.banks.push(meta);
  await pushBank(meta,qs);await Local.set('bank.'+meta.id,meta);
}
async function deleteBank(id){
  S.banks=S.banks.filter(b=>b.id!==id);const m=await Local.get('bank.'+id);
  await Local.del('bank.'+id);await Local.del('questions.'+id);S.qcache.delete(id);
  S.settings.deleted=[...(S.settings.deleted||[]),id];await saveSettings();
  await Cloud.del('bank.'+id);for(let i=0;i<(m&&m.chunks||0);i++)await Cloud.del('chunk.'+id+'.'+i);
}
async function persistSession(cloud){
  const s=S.session;if(!s)return;s.t=Date.now();await Local.set('session',s);
  if(cloud)Cloud.set('session','session',s);
}
async function clearSession(){S.session=null;await Local.del('session');Cloud.del('session')}
async function saveAttempt(a){
  const i=S.attempts.findIndex(x=>x.id===a.id);if(i>=0)S.attempts[i]=a;else S.attempts.push(a);
  await Local.set('attempt.'+a.id,a);Cloud.set('attempt.'+a.id,'attempt',a);
}
async function boot(){
  await Local.open();
  S.settings=await Local.get('settings')||{exams:DEFAULT_EXAMS,t:0,hideSamples:[],deleted:[]};
  for(const k of await Local.keys('bank.'))S.banks.push(await Local.get(k));
  for(const k of await Local.keys('attempt.'))S.attempts.push(await Local.get(k));
  S.session=await Local.get('session')||null;
  render();
  if(!window.claude||!claude.use)return;
  S.sync='wait';render();
  claude.use('sample').then(x=>{S.sample=x;if(S.view==='import')render()}).catch(()=>{});
  claude.use('assets').then(x=>{S.assets=x}).catch(()=>{});
  if(!await Cloud.init()){S.sync='local';refreshHome();return}
  const remoteSet=(await Cloud.list('settings'))[0];
  if(remoteSet&&remoteSet.v&&(remoteSet.v.t||0)>(S.settings.t||0)){S.settings=remoteSet.v;await Local.set('settings',S.settings)}
  const del=new Set(S.settings.deleted||[]);
  const banks=await Cloud.list('bank');
  for(const d of banks){const b=d.v;if(!b||del.has(b.id))continue;const i=S.banks.findIndex(x=>x.id===b.id);if(i<0){S.banks.push(b);await Local.set('bank.'+b.id,b)}}
  for(const b of S.banks){if(!banks.some(d=>d.v&&d.v.id===b.id)){const q=await Local.get('questions.'+b.id);if(q)pushBank(b,q)}}
  S.banks=S.banks.filter(b=>!del.has(b.id));
  const att=await Cloud.list('attempt');
  for(const d of att){const a=d.v;if(a&&!S.attempts.some(x=>x.id===a.id)){S.attempts.push(a);await Local.set('attempt.'+a.id,a)}}
  for(const a of S.attempts)if(!att.some(d=>d.v&&d.v.id===a.id))Cloud.set('attempt.'+a.id,'attempt',a);
  const rs=(await Cloud.list('session'))[0];
  if(rs&&rs.v&&(!S.session||(rs.v.t||0)>(S.session.t||0))&&S.view==='home'){S.session=rs.v;await Local.set('session',S.session)}
  S.sync='ok';refreshHome();
}
function refreshHome(){if(S.view==='home')render();else setSync(S.sync)}

function shell(body){return `<div class="top"><div class="top-in"><strong>Exam Simulator</strong><button class="btn link" style="color:var(--bar-ink)" data-act="home">Home</button><span class="sync" id="sync">${esc(syncLabel())}</span></div></div><main class="wrap">${body}</main>`}

function examStats(key){
  const list=S.attempts.filter(a=>a.examKey===key&&a.mode==='exam'&&!a.sample).sort((x,y)=>x.endedAt-y.endedAt);
  return{list,last:list[list.length-1],best:list.reduce((m,a)=>Math.max(m,a.score),0)};
}
function spark(list,e){
  if(list.length<2)return'';
  const W=240,H=44,pts=list.slice(-12),max=1000,y=v=>H-4-(v/max)*(H-8),x=i=>4+i*(W-8)/(pts.length-1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="44" role="img" aria-label="Scores across your last ${pts.length} exams, pass mark ${e.pass}"><line x1="0" x2="${W}" y1="${y(e.pass)}" y2="${y(e.pass)}" stroke="var(--muted)" stroke-dasharray="3 3"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map((a,i)=>x(i)+','+y(a.score)).join(' ')}"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1].score)}" r="3.5" fill="var(--accent)"/></svg>`;
}

function bindDrop(){
  const f=$('#pdf-file');
  f.addEventListener('change',()=>{const fl=f.files[0];f.value='';if(fl)startImport(fl)});
  const zone=e=>e.target.closest&&e.target.closest('#drop');
  document.addEventListener('dragover',e=>{e.preventDefault();const d=$('#drop');if(d)d.classList.toggle('over',!!zone(e))});
  document.addEventListener('dragleave',e=>{const d=$('#drop');if(d&&!e.relatedTarget)d.classList.remove('over')});
  document.addEventListener('drop',e=>{e.preventDefault();const d=$('#drop');if(d)d.classList.remove('over');const fl=e.dataTransfer.files[0];if(fl&&S.view==='home')startImport(fl)});
}
/* --- import --- */
function guessExam(text){
  const count=re=>(text.match(re)||[]).length,c=count(/claude|anthropic|cca-?f\b|mcp\b|subagent/gi),m=count(/sc-?300|entra|conditional access|privileged identity/gi);
  const key=c>m?'cca-f':m>c?'sc-300':S.settings.exams[0].key;
  return S.settings.exams.some(e=>e.key===key)?key:S.settings.exams[0].key;
}
async function startImport(file){
  if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){toast('Please choose a PDF file.');return}
  S.imp={stage:'reading',name:file.name.replace(/\.pdf$/i,''),msg:'Opening the PDF',pct:0,questions:[],lines:[],showAll:false,dropped:0};
  go('import');
  const step=(m,p)=>{S.imp.msg=m;S.imp.pct=p;const a=$('#imp-msg'),b=$('#imp-bar');if(a)a.textContent=m;if(b)b.style.width=Math.round(p*100)+'%'};
  try{
    const r=await readPdf(file,step);
    Object.assign(S.imp,{doc:r.doc,pages:r.pages});
    const lines=cleanLines(r.lines);S.imp.lines=lines;
    if(lines.length<20){S.imp.stage='scanned';render();return}
    let qs=parseLines(lines);
    if(qs.length){const f=await findImages(r.doc,pdfjs,qs,step);if(f.images.length){await cropImages(r.doc,f.images,step);attachImages(f.wanted,f.images)}}
    finishImport(qs,lines.slice(0,400).map(l=>l.t).join(' ')+file.name);
  }catch(e){
    console.error(e);
    S.imp.stage='error';S.imp.err=e&&e.message==='reader-load'?'The PDF reader could not load. Check your connection and try again, or use Paste text instead.':/password/i.test(e&&e.name||'')?'This PDF is password protected. Remove the password and try again.':'This file could not be read as a PDF. Try saving it again as a PDF, or use Paste text instead.';render();
  }
}
function finishImport(qs,sample){
  const d=dedupe(qs);S.imp.questions=d.qs;S.imp.dropped=d.dropped;S.imp.examKey=S.imp.examKey||guessExam(sample);S.imp.stage='review';render();
}
const importable=q=>!q.excluded&&!!q.stem&&(q.manual||q.answer.length>0);

   <div class="grid2"><label class="field">Name this question set<input id="imp-name" type="text" value="${esc(m.name)}"></label>

  modal(`<h2>${nw?'Add an exam':'Exam settings'}</h2>
  <div class="grid2"><label class="field">Exam code<input id="x-code" type="text" value="${esc(e.code)}"></label><label class="field">Exam date<input id="x-date" type="date" value="${esc(e.date)}"></label></div>
  <label class="field">Name<input id="x-name" type="text" value="${esc(e.name)}"></label>
  <div class="grid2"><label class="field">Questions<input id="x-qs" type="number" value="${e.qs}"></label><label class="field">Minutes<input id="x-mins" type="number" value="${e.mins}"></label></div>
  <label class="field">Pass mark out of 1000<input id="x-pass" type="number" value="${e.pass}"></label>
  <label class="row"><input id="x-lock" type="checkbox" ${e.lock?'checked':''}> Case studies and Yes/No sets lock after you leave them</label>
  ${e.note?`<p class="small muted">${esc(e.note)}</p>`:''}
  <div class="row"><button class="btn primary" id="x-save">Save</button><button class="btn" data-act="close-modal">Cancel</button></div>`);
  $('#x-save').onclick=async()=>{
    Object.assign(e,{code:$('#x-code').value.trim()||'Exam',date:$('#x-date').value,name:$('#x-name').value.trim()||'Exam',qs:+$('#x-qs').value||50,mins:+$('#x-mins').value||60,pass:+$('#x-pass').value||700,lock:$('#x-lock').checked});
    if(nw)S.settings.exams.push(e);await saveSettings();closeModal();render();
  };
}
function pasteModal(){
  modal(`<h2>Paste your questions</h2><p class="small muted">Plain text in the usual layout, or a backup you copied from this simulator.</p><textarea id="p-text" style="min-height:240px"></textarea><div class="row"><button class="btn primary" id="p-go">Read questions</button><button class="btn" data-act="close-modal">Cancel</button></div>`);
  $('#p-go').onclick=()=>{
    const t=$('#p-text').value.trim();if(!t)return;closeModal();
    S.imp={stage:'reading',name:'Pasted questions',questions:[],lines:[],showAll:false,dropped:0};
    if(t.startsWith('{')||t.startsWith('[')){try{const j=JSON.parse(t);const qs=Array.isArray(j)?j:j.questions;if(j.name)S.imp.name=j.name;if(j.examKey)S.imp.examKey=j.examKey;qs.forEach(q=>{q.id=q.id||uid();q.images=q.images||[];q.answerImages=q.answerImages||[];q.issues=issuesOf(q)});S.view='import';finishImport(qs,t.slice(0,3000));return}catch(e){}}
    const lines=t.split(/\r?\n/).map((x,i)=>({t:x.trim(),page:1,y:i/1e6})).filter(l=>l.t);
    S.imp.lines=lines;S.view='import';finishImport(parseLines(lines),t.slice(0,3000));
  };
}
/* --- events --- */
async function runClaude(){
  const imp=S.imp,prev=imp.stage;imp.stage='claude';imp.cancel=false;imp.pct=0;imp.msg='Claude is reading the PDF';render();
  try{
    const r=await claudeRead((m,p)=>{imp.msg=m;imp.pct=p;const a=$('#imp-msg'),b=$('#imp-bar');if(a)a.textContent=m;if(b)b.style.width=Math.round(p*100)+'%'});
    imp.questions=r.qs;imp.dropped=r.dropped;imp.examKey=imp.examKey||guessExam(r.qs.slice(0,20).map(q=>q.stem).join(' '));imp.stage='review';render();
  }catch(e){
    imp.stage=prev==='claude'?'review':prev;render();
    toast(e&&e.code==='rate_limited'?'Claude is busy. Try again in a minute.':e&&e.code==='not_granted'?'Claude access was declined.':'Claude could not finish reading this PDF.');
  }
}
const ACT={
  home(){S.imp=null;go('home')},
  paste(){pasteModal()},
  'close-modal'(){closeModal()},
  'edit-exam'(el){examModal(el.dataset.k)},
  'add-exam'(){examModal()},
  async setup(el){
    const k=el.dataset.k,e=examOf(k);const bs=allBanks().filter(b=>b.examKey===k),own=bs.filter(b=>!b.sample);const ids=(own.length?own:bs).map(b=>b.id),ns=[];for(const id of ids)ns.push(...(await getQuestions(id)).filter(importable).map(q=>q.n));
    S.setup={key:k,mode:el.dataset.m==='exam'?'exam':'practice',bankIds:ids,min:ns.length?Math.min(...ns):1,max:ns.length?Math.max(...ns):1};go('setup');setupHint();
  },
  async build(){
    const c=S.setup,e=examOf(c.key);
    const ex=c.mode==='exam';
    /* practice keeps the PDF's option order, because explanations refer to the original letters */
    const {f,t}=setupRange();
    const cfg={key:c.key,bankIds:[...document.querySelectorAll('.bank-pick:checked')].map(x=>x.value),mode:c.mode,pool:$('#s-pool').value,from:f,to:t,order:$('#s-order').value,n:ex?(+$('#s-n').value||e.qs):1e6,mins:ex?(+$('#s-m').value||e.mins):e.mins,shuffleOpts:ex&&$('#s-so').checked,lock:ex&&!!($('#s-lock')&&$('#s-lock').checked)};
    if(!cfg.bankIds.length){toast('Choose at least one question set.');return}
    await buildSession(cfg);
  },
  async begin(){const s=S.session;s.started=Date.now();if(s.mode==='exam')s.deadline=s.started+s.mins*60000;await persistSession(true);go('exam')},
  async resume(){
    const s=S.session;for(const id of s.bankIds)await getQuestions(id);
    if(!s.started){go('intro');return}
    if(s.deadline&&s.deadline<Date.now()){await finishExam('time');return}
    go('exam');
  },
  discard(){ask('Discard this exam?','Your answers in this session will be lost.','Discard',async()=>{await clearSession();go('home')},'Keep it')},
  pick(el){
    const s=S.session,it=s.items[s.idx],q=Q(it),k=el.dataset.k,multi=q.pick>1||q.answer.length>1;
    if(multi){
      if(it.given.includes(k))it.given=it.given.filter(x=>x!==k);
      else{it.given.push(k);const lim=q.pick||q.answer.length;if(it.given.length>lim)it.given.shift()}
    }else it.given=[k];
    persistSession(false);keep();render();
  },
  strike(el){const it=S.session.items[S.session.idx],k=el.dataset.k;it.struck=it.struck.includes(k)?it.struck.filter(x=>x!==k):[...it.struck,k];if(it.struck.includes(k))it.given=it.given.filter(x=>x!==k);keep();render()},
  flag(){const it=S.session.items[S.session.idx];it.flagged=!it.flagged;keep();render()},
  check(){if(S.session.mode!=='practice')return;S.session.items[S.session.idx].checked=true;persistSession(false);keep();render()},
  font(el){S.fontScale=Math.min(1.4,Math.max(.85,(S.fontScale||1)+(+el.dataset.d)*.1));document.documentElement.style.setProperty('--qsize',Math.round(17*S.fontScale)+'px')},
  fullscreen(){const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>toast('Full screen is not available here.'))},
  prev(){const s=S.session;if(s.idx>curSec(s).start){s.idx--;go('exam')}},
  next(){
    const s=S.session,sec=curSec(s);
    if(sec.type==='series'){if(s.idx<sec.end-1){s.idx++;persistSession(true);go('exam')}else endSection();return}
    if(s.idx<sec.end-1){s.idx++;persistSession(false);go('exam')}else go('review-screen');
  },
  review(){go('review-screen')},
  'back-q'(){go('exam')},
  jump(el){S.session.idx=+el.dataset.i;go('exam')},
  'end-sec'(){endSection()},
  async 'view-attempt'(el){
    const a=S.attempts.find(x=>x.id===el.dataset.id);for(const id of a.bankIds)await getQuestions(id);go('results',{attemptId:a.id,rFilter:'wrong'});
  },
  rf(el){S.rFilter=el.dataset.f;render()},
  async self(el){
    const a=S.attempts.find(x=>x.id===S.attemptId),it=a.items[+el.dataset.n];it.correct=el.dataset.v==='1';Object.assign(a,computeScore(a));await saveAttempt(a);render();
  },
  async explain(el){
    const a=S.attempts.find(x=>x.id===S.attemptId),n=+el.dataset.n,i=a.items[n],q=Q(i),box=$('#ai-'+n);
    el.disabled=true;box.innerHTML='<div class="explain" id="ai-t-'+n+'">Thinking…</div>';
    try{
      const p='I am preparing for the '+a.name+' exam. Explain briefly in plain English why the correct answer is right and why my answer is wrong. Under 150 words.\n\n'+(q.context?'Scenario: '+q.context+'\n':'')+'Question: '+q.stem+'\n'+q.options.map(o=>o.k+'. '+o.t).join('\n')+'\nCorrect answer in my study notes: '+q.answer.join(', ')+'\nMy answer: '+(i.given.join(', ')||'blank')+'\nIf my notes look wrong, say so.';
      await S.sample(p,{modelTier:'quick',onText:({text})=>{const t=$('#ai-t-'+n);if(t)t.textContent=text}});
    }catch(e){box.innerHTML='<div class="banner warn">Claude could not answer just now. Try again in a minute.</div>';el.disabled=false}
  },
  async 'retake-wrong'(){
    const a=S.attempts.find(x=>x.id===S.attemptId),ids=a.items.filter(i=>i.correct!==true).map(i=>i.qid);
    if(!ids.length){toast('You got every question right.');return}
    const e=examOf(a.examKey);await buildSession({key:a.examKey,bankIds:a.bankIds,mode:'practice',pool:'all',order:'pdf',n:ids.length,mins:e.mins,shuffleOpts:false,lock:false},ids);
  },
  async 'open-bank'(el){
    const id=el.dataset.id;
    if(id.startsWith('sample-')){ask('Hide the sample set?','You can add it back by clearing this page\'s data. Your own questions are not affected.','Hide',async()=>{S.settings.hideSamples=[...(S.settings.hideSamples||[]),id];await saveSettings();render()},'Keep it');return}
    const meta=S.banks.find(b=>b.id===id),qs=await getQuestions(id);S.bank={meta,qs};go('bank');
  },
  async 'save-bank'(){const b=S.bank;b.meta.count=b.qs.filter(importable).length;await saveBank(b.meta,b.qs);toast('Saved.')},
  async 'copy-bank'(){const b=S.bank;try{await navigator.clipboard.writeText(JSON.stringify({name:b.meta.name,examKey:b.meta.examKey,questions:b.qs.map(q=>({...q,images:[],answerImages:[]}))}));toast('Copied. Paste it into a text file to keep it.')}catch(e){toast('Copy was blocked by the browser.')}},
  'del-bank'(){ask('Delete this question set?','Your exam history stays, but you will not be able to review these questions.','Delete',async()=>{await deleteBank(S.bank.meta.id);go('home')},'Keep it')},
  'toggle-all'(){S.imp.showAll=!S.imp.showAll;render()},
  'edit-q'(el){const list=el.dataset.src==='imp'?S.imp.questions:S.bank.qs,q=list[+el.dataset.i];editQModal(q,render)},
  'excl-q'(el){const list=el.dataset.src==='imp'?S.imp.questions:S.bank.qs,q=list[+el.dataset.i];q.excluded=!q.excluded;render()},
  'claude-read'(){runClaude()},
  'cancel-claude'(){S.imp.cancel=true},
  async 'save-import'(el){
    const m=S.imp;m.name=$('#imp-name').value.trim()||m.name;m.examKey=$('#imp-exam').value;
    el.disabled=true;el.textContent='Saving…';
    const id=uid(),qs=m.questions.filter(importable);
    await storeImages(qs);
    const meta={id,name:m.name,examKey:m.examKey,count:qs.length,addedAt:Date.now(),chunks:0};
    qs.forEach(q=>{q.bankId=id;delete q.start;delete q.end;delete q.ansPos});
    await saveBank(meta,qs);S.imp=null;go('home');toast(qs.length+' questions saved.');
  },
};
function keep(){const p=$('#qpane');S.keepScroll=p?p.scrollTop:null}
function endSection(){
  const s=S.session,last=s.sec===s.sections.length-1,sec=curSec(s),un=s.items.slice(sec.start,sec.end).filter(i=>!i.given.length&&!i.note).length;
  const warn=un?`You have ${un} unanswered question${un===1?'':'s'}. `:'';
  if(s.mode==='practice'&&last)ask('End practice?',warn+'You will see your results next.','End practice',()=>finishExam('done'),'Go back');
  else if(last)ask('End the exam?',warn+'You cannot change your answers after this.','End exam',()=>finishExam('done'),'Go back');
  else ask('Finish this section?',warn+'You cannot return to it.','Finish section',()=>{s.sec++;s.idx=curSec(s).start;persistSession(true);go('exam')},'Go back');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act;if(a==='note')return;
  if(a==='strike')e.preventDefault();
  if(ACT[a])ACT[a](el);
});
document.addEventListener('input',e=>{if(S.view==='setup'&&(/^s-(from|to|pool|n|m|order)$/.test(e.target.id)||e.target.classList.contains('bank-pick'))){setupHint(e.target.id);return}if(e.target.id==='note'){S.session.items[S.session.idx].note=e.target.value;persistSession(false)}});
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||S.modalOpen||/TEXTAREA|INPUT|SELECT/.test(e.target.tagName)&&e.target.type!=='radio'&&e.target.type!=='checkbox')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const s=S.session,it=s.items[s.idx],q=Q(it),k=e.key.toUpperCase();
  const p=LETTERS.indexOf(k);
  if(k==='N'||e.key==='ArrowRight'){e.preventDefault();ACT.next();return}
  if(k==='P'||e.key==='ArrowLeft'){e.preventDefault();if(curSec(s).type!=='series')ACT.prev();return}
  if(k==='M'&&curSec(s).type!=='series'){ACT.flag();return}
  if(k==='S'&&s.mode==='practice'){ACT.check();return}
  if(p>=0&&p<it.order.length&&!(s.mode==='practice'&&it.checked)){ACT.pick({dataset:{k:q.options[it.order[p]].k}})}
});
bindDrop();
boot();
</script>
